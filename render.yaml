services:
  - type: web
    name: binance-trade-bot
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TRADING_MODE
        value: paper
      - key: START_BALANCE
        value: "10000"
      - key: TRADING_SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
      - key: TIMEFRAME
        value: "5m"
      - key: STRATEGY
        value: sma_cross
      - key: STAKE_AMOUNT
        value: "100"
      - key: STOP_LOSS_PCT
        value: "2"
      - key: TAKE_PROFIT_PCT
        value: "4"
      - key: MAX_OPEN_TRADES
        value: "3"
      - key: POLL_INTERVAL
        value: "15"
