# Backend Go — deploy bằng Render Web Service (thủ công, free plan)
#
# Cấu trúc repo: module Go nằm ở GỐC repo (go.mod + main.go + internal/).
# Service Render của bạn đang build từ gốc repo với Go runtime.
#
# Cấu hình đúng trên Render (Settings → Build & Deploy):
#   Root Directory: (để trống — mặc định)
#   Runtime:       Go
#   Build Command: go build -tags netgo -ldflags '-s -w' -o app
#   Start Command: ./app
#   Instance Type: Free
#   Environment variables (optional, đều có default):
#     TRADING_MODE=paper
#     TRADING_SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
#     TIMEFRAME=5m
#     STRATEGY=sma_cross
#     BINANCE_API_KEY / BINANCE_API_SECRET (chỉ cần cho live mode)
#
# Lưu ý free plan:
#   - Sleep sau 15 phút không request → dùng cron-job.org ping /health mỗi 10 phút
#   - Disk ephemeral → JSON store mất khi redeploy (chấp nhận cho testnet bot)
services:
  - type: web
    name: binance-trade-bot
    runtime: go
    plan: free
    region: singapore
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /health
