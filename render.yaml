# Backend Go — deploy bằng Render Web Service (thủ công, free plan)
#
# Render KHÔNG hỗ trợ Blueprint trên free plan — tạo Web Service thủ công:
#   Render → New + → Web Service → connect repo deegung01/binance-trade-bot
#   Settings:
#     Name:          binance-trade-bot
#     Region:        Singapore
#     Branch:        main
#     Root Directory: backend-go
#     Runtime:       Go          (Render tự nhận diện go.mod)
#     Build Command:  go build -o app ./cmd/server
#     Start Command:  ./app
#     Instance Type:  Free
#   Environment variables (optional, đều có default):
#     TRADING_MODE=paper
#     TRADING_SYMBOLS=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
#     TIMEFRAME=5m
#     STRATEGY=sma_cross
#     BINANCE_API_KEY / BINANCE_API_SECRET (chỉ cần cho live mode)
#
# Lưu ý free plan:
#   - Sleep sau 15 phút không request → dùng cron-job.org ping /health mỗi 10 phút
#   - Disk ephemeral → JSON store mất khi redeploy (chấp nhận cho testnet bot)
services:
  - type: web
    name: binance-trade-bot
    runtime: go
    plan: free
    region: singapore
    rootDir: backend-go
    buildCommand: go build -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: TRADING_MODE
        value: paper
      - key: TRADING_SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
      - key: TIMEFRAME
        value: 5m
      - key: STRATEGY
        value: sma_cross
